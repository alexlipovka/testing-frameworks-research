[project]
name = "bakeoff-aidbox-sdk"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "aidbox-python-sdk==0.2.3",
    "aiohttp==3.14.3",
    "fhirpy==2.3.0",
    "fhirpy-types-r4b==0.1.1",
    "pytest==9.0.3",
    "pytest-aiohttp==1.1.0",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
asyncio_mode = "auto"
pythonpath = ["."]
aidbox_create_app = "app.main:application"
usefixtures = ["safe_db"]
filterwarnings = [
    "ignore:Inheritance class AidboxSession from ClientSession is discouraged:DeprecationWarning",
    "ignore:BasicAuth is deprecated:DeprecationWarning:aidbox_python_sdk",
    "ignore:The 'auth' parameter is deprecated:DeprecationWarning:aidbox_python_sdk",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
