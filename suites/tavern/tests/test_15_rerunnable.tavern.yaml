# Case 15: rerunnable. No run left rows behind; run.sh twice must be green
# (this test fails on the second run if the first one leaked).
test_name: no residue from earlier runs
stages:
  - name: no bakeoff rows outside this run
    request:
      url: "{base}/$psql"
      method: POST
      headers: {Authorization: "{admin_auth}"}
      json:
        query: >-
          SELECT count(*) AS n FROM (
            SELECT id FROM patient UNION ALL SELECT id FROM "user" UNION ALL SELECT id FROM client
            UNION ALL SELECT id FROM consent UNION ALL SELECT id FROM role UNION ALL SELECT id FROM accesspolicy
            UNION ALL SELECT id FROM encounter UNION ALL SELECT id FROM observation
          ) t WHERE id LIKE 'bakeoff-%' AND id NOT LIKE '{run_id}-%'
    response:
      status_code: 200
      json: {status: success, result: [{data: [{n: 0}]}]}
