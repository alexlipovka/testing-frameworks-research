id: as-practitioner-search-consented-patients
resourceType: AccessPolicy
roleName: practitioner
description: >
  Search Patient by _id when EVERY comma-separated id has an active Consent naming the practitioner.
engine: complex
and:
  - engine: matcho
    matcho:
      operation:
        id: FhirSearch
      request-method: get
      params:
        resource/type: Patient
        _id: present?
  # "No requested id lacks a Consent", not "some requested id has one"
  - engine: sql
    sql:
      query: |
        SELECT true
        WHERE trim({{params._id}}::text) <> ''
          AND coalesce({{query-string}}, '') !~* '(^|&)(_|%5f)(rev)?include'
          AND NOT EXISTS (
            SELECT 1
            FROM unnest(string_to_array({{params._id}}::text, ',')) AS req(id)
            WHERE NOT EXISTS (
              SELECT 1
              FROM consent c
              JOIN jsonb_array_elements(c.resource#>'{provision,actor}') AS actor ON true
              WHERE c.resource->>'status' = 'active'
                AND c.resource#>>'{patient,id}' = trim(req.id)
                AND actor#>>'{reference,resourceType}' = 'Practitioner'
            )
          )
