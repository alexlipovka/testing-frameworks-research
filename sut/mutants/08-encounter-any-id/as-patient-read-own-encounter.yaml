id: as-patient-read-own-encounter
resourceType: AccessPolicy
roleName: patient
description: A patient reads an Encounter by id when its subject is their own Patient.
engine: sql
sql:
  # Aidbox params take double braces; the Postgres path literal '{subject,id}' keeps single ones
  query: |
    SELECT true
    FROM encounter
    WHERE {{params.resource/type}} = 'Encounter'
      AND resource#>>'{subject,id}' = {{role.links.patient.id}}
